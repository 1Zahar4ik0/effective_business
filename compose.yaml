name: opora-apk
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: navigator
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - navigator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d navigator"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://navigator:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/navigator
      APP_ENV: ${APP_ENV:-demo}
      SEED_DEMO: ${SEED_DEMO:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_ADMIN_IDS: ${MAX_ADMIN_IDS:-}
      MAX_APP_URL: ${MAX_APP_URL:-}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
      STATIC_DIR: /app/frontend/dist
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  navigator_data:
