# Только отдельный стенд сдачи. Не использует основной том и рабочие секреты.
name: opora-apk-release-check
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: navigator
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: isolated-demo-only
    volumes:
      - release_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d navigator"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    image: opora-apk-app
    environment:
      DATABASE_URL: postgresql+psycopg://navigator:isolated-demo-only@db:5432/navigator
      APP_ENV: demo
      SEED_DEMO: "true"
      PUBLIC_ORIGIN: http://localhost:8001
      STATIC_DIR: /app/frontend/dist
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  release_data:
